services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schedule}
      POSTGRES_DB: schedule_planner
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d schedule_planner"]
      interval: 5s
      timeout: 3s
      retries: 10
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
  db-migrate:
    image: node:24-slim
    working_dir: /app/services/schedule-api
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/schedule-api:/app/services/schedule-api:ro
      - ./node_modules:/app/node_modules:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    entrypoint: ["sh", "-c", "npm install --prefix /tmp/migration --no-save node-pg-migrate pg && /tmp/migration/node_modules/.bin/node-pg-migrate up -m /app/services/schedule-api/migrations"]
    restart: "no"

volumes:
  postgres-data:
  azurite-data: